<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>VVIS | Local Engine</title>
    <style>
        :root {
            --theme-primary: #e04815;
            --theme-secondary: #e04815;
            --theme-bg: #281f1f;
            --theme-bg-rgb: 5, 5, 5;
            --theme-danger: #ff4d4d;
            --theme-homing: #ffd166;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: var(--theme-bg);
            overflow: hidden;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 0;
        }
        #titlebar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--theme-primary);
            background: rgba(var(--theme-bg-rgb), 0.9);
            color: var(--theme-primary);
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            z-index: 1000;
            -webkit-app-region: drag;
            pointer-events: auto;
            user-select: none;
        }
        #titlebar-label {
            flex: 1;
            height: 100%;
            display: flex;
            align-items: center;
            padding-left: 12px;
            font-size: 12px;
            text-transform: uppercase;
            -webkit-app-region: inherit;
        }
        #titlebar-buttons {
            display: flex;
            height: 100%;
            -webkit-app-region: no-drag;
        }
        #titlebar-buttons button {
            width: 46px;
            border: 0;
            border-left: 1px solid var(--theme-primary);
            background: rgba(var(--theme-bg-rgb), 0.95);
            color: var(--theme-primary);
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            -webkit-app-region: no-drag;
        }
        #titlebar-buttons button:hover {
            background: rgba(var(--theme-bg-rgb), 0.6);
        }
        #window-close:hover {
            background: #7b1b1b;
            color: #ffffff;
        }
        #ui-overlay {
            position: absolute; top: 56px; left: 20px;
            color: var(--theme-primary); font-family: 'Courier New', monospace;
            pointer-events: none; text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 6;
        }
        #serial-panel {
            position: static;
            width: 380px;
            padding: 12px;
            border: 1px solid var(--theme-primary);
            background: rgba(var(--theme-bg-rgb), 0.75);
            color: var(--theme-primary);
            font-family: 'Courier New', monospace;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 5;
        }
        #right-column {
            position: absolute;
            top: 56px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 5;
            pointer-events: none;
        }
        #left-panel {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 96px;
            padding: 8px;
            border: 1px solid var(--theme-primary);
            background: rgba(var(--theme-bg-rgb), 0.75);
            color: var(--theme-primary);
            font-family: 'Courier New', monospace;
            pointer-events: auto;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        #left-panel .vertical-container {
            width: 48px;
            height: 240px;
            position: relative;
            display: block;
            padding-top: 8px;
            padding-bottom: 8px;
        }

        /* Center the rotated range absolutely inside the container */
        #left-panel input[type="range"].vertical-slider {
            -webkit-appearance: none;
            width: 180px; /* visual length before rotation */
            height: 18px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) rotate(-90deg);
            transform-origin: center center;
            outline: none;
            background: transparent;
        }

        /* Webkit styling for track/thumb so it looks reasonable when rotated */
        #left-panel input[type="range"].vertical-slider::-webkit-slider-runnable-track {
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
        }
        #left-panel input[type="range"].vertical-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--theme-primary);
            border-radius: 50%;
            margin-top: 0;
        }
        #serial-row {
            display: flex;
            gap: 6px;
        }
        #serial-panel input,
        #serial-panel select,
        #serial-panel button {
            background: #111;
            color: var(--theme-primary);
            border: 1px solid var(--theme-primary);
            padding: 6px;
            font-family: inherit;
        }
        #theme-config {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }
        #idle-panel {
            position: static;
            width: 380px;
            padding: 12px;
            border: 1px solid var(--theme-primary);
            background: rgba(var(--theme-bg-rgb), 0.75);
            color: var(--theme-primary);
            font-family: 'Courier New', monospace;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 5;
        }
        .idle-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }
        #theme-config input[type="color"] {
            width: 34px;
            height: 24px;
            padding: 0;
            border: 1px solid var(--theme-primary);
            background: transparent;
            cursor: pointer;
        }
        #idle-panel input[type="range"] {
            width: 140px;
            accent-color: var(--theme-primary);
            cursor: pointer;
            flex: 1;
        }
        #idle-panel select {
            background: #111;
            color: var(--theme-primary);
            border: 1px solid var(--theme-primary);
            padding: 6px;
            font-family: inherit;
            flex: 1;
        }
        .idle-value {
            width: 64px;
            text-align: right;
        }
        #serial-input {
            flex: 1;
        }
        #serial-log {
            height: 180px;
            overflow: auto;
            border: 1px solid var(--theme-primary);
            padding: 6px;
            font-size: 12px;
            white-space: pre-wrap;
            background: rgba(var(--theme-bg-rgb), 0.6);
        }
        #scan-stats {
            position: absolute;
            bottom: 20px;
            left: 20px;
            padding: 10px 12px;
            border: 1px solid var(--theme-primary);
            background: rgba(var(--theme-bg-rgb), 0.75);
            color: var(--theme-primary);
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            font-size: 12px;
            pointer-events: none;
            z-index: 5;
            min-width: 220px;
            line-height: 1.6;
        }
        #scan-stats .value {
            float: right;
            margin-left: 16px;
        }
        #reset-scan {
            position: absolute;
            right: 20px;
            bottom: 20px;
            padding: 8px 14px;
            border: 1px solid var(--theme-primary);
            background: rgba(var(--theme-bg-rgb), 0.85);
            color: var(--theme-primary);
            font-family: 'Courier New', monospace;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            z-index: 6;
            pointer-events: auto;
        }
        #reset-scan:hover {
            background: rgba(var(--theme-bg-rgb), 0.6);
        }
    </style>
</head>
<body>
    <div id="titlebar">
        <div id="titlebar-label">VVIS | Local Engine</div>
        <div id="titlebar-buttons">
            <button id="window-minimize" title="Minimize">-</button>
            <button id="window-maximize" title="Maximize">+</button>
            <button id="window-close" title="Close">x</button>
        </div>
    </div>

    <div id="ui-overlay">
        <div style="font-size: 1.5em; font-weight: bold;">VVIS</div>
        <div id="engine-status">Engine: Loading</div>
        <div id="esp-status">ESP32: Disconnected</div>
        <div id="runtime-status">Status: Idle</div>
    </div>

    <div id="left-panel">
        <div style="font-weight: bold; letter-spacing: 1px;">View</div>
        <div class="vertical-container">
            <!-- Hidden native input kept for compatibility with renderer code -->
            <input id="max-height" type="hidden" value="8.0" />
            <!-- Custom vertical slider control -->
            <div id="max-height-control" class="custom-vertical-slider" role="slider" tabindex="0" aria-valuemin="-8" aria-valuemax="8" aria-valuenow="8">
                <div class="track"></div>
                <div class="thumb" aria-hidden="true"></div>
            </div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center; gap:4px; margin-top:2px;">
            <div style="font-size:11px;">Max Height</div>
            <div id="max-height-value" style="font-size:11px;">8.0 m</div>
        </div>
        </div>
    </div>

    <div id="scan-stats">
        <div>Time Spent Scanning <span id="scan-time" class="value">00:00.0</span></div>
        <div># of Points <span id="point-count" class="value">0</span></div>
        <div>Framerate <span id="frame-rate" class="value">0.0 FPS</span></div>
    </div>

    <button id="reset-scan" type="button">Reset Scan</button>

    <div id="right-column">
        <div id="serial-panel">
            <div style="font-weight: bold; letter-spacing: 1px;">Serial Terminal</div>
            <div id="serial-row">
                <select id="serial-port"></select>
                <input id="serial-baud" type="number" value="115200" min="1200" step="1" />
                <button id="serial-toggle-debug">Hide Debug</button>
            </div>
            <div id="serial-row">
                <input id="serial-input" type="text" placeholder="Enter command" />
                <button id="serial-send">Send</button>
            </div>
            <div id="theme-config">
                <span>Theme</span>
                <span>FG</span>
                <input id="theme-primary" type="color" value="#e04815" />
                <span>BG</span>
                <input id="theme-secondary" type="color" value="#281f1f" />
            </div>
            <div id="serial-log"></div>
        </div>

        <div id="idle-panel">
            <div style="font-weight: bold; letter-spacing: 1px;">Idle Pattern</div>
            <div class="idle-row">
                <span>Pattern</span>
                <select id="idle-pattern-select">
                    <option value="ribbon-bloom" selected>Ribbon Bloom</option>
                    <option value="helix-shell">Helix Shell</option>
                    <option value="rose-lattice">Rose Lattice</option>
                </select>
            </div>
            <div class="idle-row">
                <span>Speed</span>
                <input id="idle-density" type="range" min="500" max="25000" step="250" value="4500" />
                <span id="idle-density-value" class="idle-value">4500</span>
            </div>
            <div class="idle-row">
                <span>Density</span>
                <input id="idle-pattern-speed" type="range" min="0.05" max="2.0" step="0.05" value="0.1" />
                <span id="idle-pattern-speed-value" class="idle-value">0.1x</span>
            </div>
            <!-- Max Height moved to left panel -->
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "./node_modules/three/build/three.module.js",
                "three/addons/": "./node_modules/three/examples/jsm/"
            }
        }
    </script>
    <style>
        /* Custom vertical slider styles */
        .custom-vertical-slider {
            width: 100%;
            max-width: 48px;
            height: 200px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        .custom-vertical-slider .track {
            position: absolute;
            left: 50%;
            top: 8px;
            transform: translateX(-50%);
            width: 6px;
            height: calc(100% - 16px);
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
        }

        .custom-vertical-slider .thumb {
            position: absolute;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            background: var(--theme-primary);
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(0,0,0,0.6);
            top: 50%; /* initial; script will place it */
        }

        .custom-vertical-slider:focus { outline: 2px solid rgba(224,72,21,0.18); }
    </style>

    <script>
        // Lightweight custom vertical slider implementation.
        (function(){
            const control = document.getElementById('max-height-control');
            const thumb = control.querySelector('.thumb');
            const track = control.querySelector('.track');
            const hidden = document.getElementById('max-height');
            const valueDisplay = document.getElementById('max-height-value');
            const MIN = -8.0; const MAX = 8.0; const STEP = 0.1;

            function clamp(v, a, b){ return Math.min(b, Math.max(a, v)); }
            function valueToY(value){
                const rect = track.getBoundingClientRect();
                const ratio = (value - MIN) / (MAX - MIN);
                return rect.top + rect.height * (1 - ratio);
            }
            function yToValue(y){
                const rect = track.getBoundingClientRect();
                const rel = clamp((y - rect.top) / rect.height, 0, 1);
                const ratio = 1 - rel;
                let v = MIN + ratio * (MAX - MIN);
                // snap to STEP
                v = Math.round(v / STEP) * STEP;
                return Number(v.toFixed(2));
            }
            function updateThumbForValue(v){
                const rect = track.getBoundingClientRect();
                const ratio = (v - MIN) / (MAX - MIN);
                const y = rect.top + rect.height * (1 - ratio);
                const controlRect = control.getBoundingClientRect();
                const topPct = ((y - controlRect.top) / controlRect.height) * 100;
                thumb.style.top = `${topPct}%`;
            }
            function setValue(v){
                v = clamp(Number(v), MIN, MAX);
                hidden.value = String(v);
                // dispatch input event so existing renderer code listening on the hidden input will react
                try { hidden.dispatchEvent(new Event('input', { bubbles: true })); } catch(e) { /* ignore */ }
                control.setAttribute('aria-valuenow', String(v));
                valueDisplay.textContent = `${v.toFixed(1)} m`;
                updateThumbForValue(v);
            }

            // initialize
            setValue(Number(hidden.value || MAX));

            let dragging = false;
            function onPointerDown(e){
                // Start dragging and capture pointer so we continue receiving events
                e.preventDefault();
                e.stopPropagation();
                dragging = true;
                try { control.setPointerCapture(e.pointerId); } catch(err) {}
                // process initial location
                const v = yToValue(e.clientY);
                setValue(v);
            }
            function onPointerMove(e){
                if(!dragging) return; // ignore unless we're actively dragging the control
                e.preventDefault();
                e.stopPropagation();
                const v = yToValue(e.clientY);
                setValue(v);
            }
            function onPointerUp(e){
                if(!dragging) return;
                e.preventDefault();
                e.stopPropagation();
                dragging = false;
                try{ control.releasePointerCapture(e.pointerId); } catch(err){}
            }

            control.addEventListener('pointerdown', onPointerDown);
            // listen globally but ignore moves unless dragging, to avoid stealing pointer events
            window.addEventListener('pointermove', onPointerMove, { passive: false });
            window.addEventListener('pointerup', onPointerUp, { passive: false });

            // keyboard
            control.addEventListener('keydown', (ev) => {
                const cur = Number(hidden.value || 0);
                if(ev.key === 'ArrowUp' || ev.key === 'PageUp'){
                    setValue(cur + STEP);
                    ev.preventDefault();
                } else if(ev.key === 'ArrowDown' || ev.key === 'PageDown'){
                    setValue(cur - STEP);
                    ev.preventDefault();
                } else if(ev.key === 'Home'){
                    setValue(MIN); ev.preventDefault();
                } else if(ev.key === 'End'){
                    setValue(MAX); ev.preventDefault();
                }
            });

            // expose a tiny helper so external code can update (keeps compatibility)
            window.__customMaxHeightSet = setValue;
        })();
    </script>

    <script type="module" src="vvis/renderer2.js"></script>
</body>
</html>
